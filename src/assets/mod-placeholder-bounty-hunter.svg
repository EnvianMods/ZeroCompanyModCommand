<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- "No image" card art for the Bounty Hunter theme: a bounty puck with a
       T-visor slot, in the theme's armor green / ochre / rust palette. The
       default Mod Command theme uses mod-placeholder.svg. Same captions as that one. -->
  <defs>
    <radialGradient id="soot" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#262a24"/>
      <stop offset="55%" stop-color="#1b1e1c"/>
      <stop offset="100%" stop-color="#111315"/>
    </radialGradient>
    <radialGradient id="puckGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c3953a" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#c3953a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c3953a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#879766" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#c3953a" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- scorched plate -->
  <rect width="640" height="360" fill="url(#soot)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- scratches -->
  <g stroke="#b9ad8f" stroke-linecap="round" fill="none">
    <path d="M58 70 L176 38" stroke-opacity="0.10" stroke-width="1"/>
    <path d="M470 300 L602 262" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M520 58 L588 96" stroke-opacity="0.07" stroke-width="1.4"/>
    <path d="M84 292 L150 318" stroke-opacity="0.07" stroke-width="1"/>
    <path d="M404 30 L440 44" stroke-opacity="0.09" stroke-width="1"/>
  </g>

  <circle cx="320" cy="150" r="118" fill="url(#puckGlow)"/>

  <!-- bounty puck with the T-visor slot -->
  <g transform="translate(320 150)">
    <circle r="64" fill="#1a1d1b" stroke="#879766" stroke-width="3" stroke-opacity="0.85"/>
    <circle r="52" fill="none" stroke="#c3953a" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <!-- visor: horizontal slot + vertical stem -->
    <path d="M-38 -20 H38 V-6 H7 V30 H-7 V-6 H-38 Z" fill="#0b0c0d" stroke="#c3953a" stroke-width="2" stroke-opacity="0.9"/>
    <!-- rust marking over the brow -->
    <path d="M-30 -34 L30 -34 L24 -28 L-24 -28 Z" fill="#8e2b20" fill-opacity="0.9"/>
    <circle cx="0" cy="44" r="4" fill="#c3953a" opacity="0.95"/>
  </g>

  <!-- stencil corner brackets -->
  <g stroke="#879766" stroke-width="2.5" stroke-opacity="0.6" fill="none">
    <path d="M24 52 V24 H52"/>
    <path d="M588 24 H616 V52"/>
    <path d="M616 308 V336 H588"/>
    <path d="M52 336 H24 V308"/>
  </g>

  <!-- captions (as in mod-placeholder.svg) -->
  <text x="320" y="258" text-anchor="middle" fill="#c3953a" fill-opacity="0.95"
        font-family="Consolas, 'Cascadia Mono', monospace" font-size="19" letter-spacing="7" font-weight="bold">NO VISUAL TRANSMISSION</text>
  <text x="320" y="284" text-anchor="middle" fill="#b9ad8f" fill-opacity="0.8"
        font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" letter-spacing="4">HOLONET ARCHIVE · ZERO COMPANY</text>

  <!-- hazard band -->
  <rect x="266" y="304" width="108" height="10" fill="url(#hazard)"/>
</svg>
