name: Build Linux AppImage

# The Windows portable exe is built locally; the AppImage needs a Linux host
# (electron-builder's AppImage packaging symlinks icons, which Windows blocks
# without Developer Mode). Runs on version tags and on demand.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  appimage:
    runs-on: ubuntu-latest
    # The attach step uploads a release asset with the workflow token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # --publish never: on tag builds electron-builder otherwise tries to
      # publish to GitHub itself and fails without a token; the attach step
      # below handles the release asset.
      - run: npx electron-builder --linux AppImage --publish never
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroCompanyModCommand-AppImage
          path: release/ZeroCompanyModCommand.AppImage
          if-no-files-found: error
      # On a version tag, attach the AppImage to that tag's GitHub release.
      # CI usually finishes before the local release flow creates the release,
      # so create it when missing — publish-release.js reuses an existing
      # release and adds the Windows zip + notes afterwards.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release/ZeroCompanyModCommand.AppImage --clobber || \
            gh release create "${GITHUB_REF_NAME}" release/ZeroCompanyModCommand.AppImage \
              --title "${GITHUB_REF_NAME}" --notes "Automated Linux AppImage build. The Windows zip and release notes follow from the local release flow."
