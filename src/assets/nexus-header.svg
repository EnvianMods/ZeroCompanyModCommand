<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 372" width="1300" height="372">
  <defs>
    <radialGradient id="space" cx="22%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#0e1c33"/>
      <stop offset="45%" stop-color="#081220"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd1ff" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#4fd1ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd1ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4fd1ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="2" width="4" height="1" fill="#000000" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1300" height="372" fill="url(#space)"/>

  <!-- a few stars -->
  <g fill="#cfe9f7">
    <circle cx="96" cy="48" r="1.5" opacity="0.7"/><circle cx="640" cy="52" r="1.6" opacity="0.6"/>
    <circle cx="880" cy="70" r="1.4" opacity="0.6"/><circle cx="1090" cy="120" r="1.6" opacity="0.6"/>
    <circle cx="1210" cy="300" r="1.3" opacity="0.5"/><circle cx="470" cy="330" r="1.3" opacity="0.45"/>
    <circle cx="1010" cy="322" r="1.2" opacity="0.45"/><circle cx="60" cy="320" r="1.4" opacity="0.5"/>
  </g>

  <!-- emblem -->
  <g transform="translate(200 186)">
    <circle r="165" fill="url(#glow)"/>
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"
             fill="none" stroke="#4fd1ff" stroke-width="4" stroke-opacity="0.95"/>
    <polygon points="0,-74 64,-37 64,37 0,74 -64,37 -64,-37"
             fill="#4fd1ff" fill-opacity="0.06" stroke="#4fd1ff" stroke-width="1.5" stroke-opacity="0.5"/>
    <g stroke="#ffc857" stroke-opacity="0.95" stroke-width="3.8" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-13"/><line x1="0" y1="13" x2="0" y2="40"/>
      <line x1="-34.6" y1="-20" x2="-11" y2="-6.5"/><line x1="11" y1="6.5" x2="34.6" y2="20"/>
      <line x1="-34.6" y1="20" x2="-11" y2="6.5"/><line x1="11" y1="-6.5" x2="34.6" y2="-20"/>
    </g>
    <circle r="7" fill="#ffc857"/>
  </g>

  <!-- vertical divider -->
  <rect x="352" y="96" width="2" height="180" fill="#4fd1ff" opacity="0.18"/>

  <!-- title block -->
  <text x="390" y="158" fill="#4fd1ff" font-family="Consolas, 'Cascadia Mono', monospace" font-size="60" font-weight="bold" letter-spacing="14">ZERO COMPANY</text>
  <rect x="392" y="172" width="620" height="2" fill="url(#cyanline)"/>
  <text x="392" y="216" fill="#ffc857" font-family="Consolas, 'Cascadia Mono', monospace" font-size="30" font-weight="bold" letter-spacing="22">MOD COMMAND</text>
  <text x="392" y="262" fill="#8fb3c9" font-family="Consolas, 'Cascadia Mono', monospace" font-size="15" letter-spacing="3">MOD MANAGER &amp; LAUNCHER FOR STAR WARS: ZERO COMPANY</text>

  <rect width="1300" height="372" fill="url(#scan)"/>
</svg>
