<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 372" width="1300" height="372">
  <defs>
    <radialGradient id="space" cx="22%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#0e1c33"/>
      <stop offset="45%" stop-color="#081220"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd1ff" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#4fd1ff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4fd1ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4fd1ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd1ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4fd1ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amberline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc857" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffc857" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd1ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4fd1ff" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="2" width="4" height="1" fill="#000000" opacity="0.16"/>
    </pattern>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#4fd1ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1300" height="372" fill="url(#space)"/>
  <rect width="1300" height="372" fill="url(#grid)"/>

  <!-- stars -->
  <g fill="#cfe9f7">
    <circle cx="96" cy="48" r="1.5" opacity="0.8"/><circle cx="330" cy="40" r="1.2" opacity="0.55"/>
    <circle cx="470" cy="330" r="1.3" opacity="0.5"/><circle cx="640" cy="52" r="1.6" opacity="0.75"/>
    <circle cx="790" cy="340" r="1.2" opacity="0.45"/><circle cx="880" cy="70" r="1.4" opacity="0.7"/>
    <circle cx="1010" cy="322" r="1.2" opacity="0.5"/><circle cx="1090" cy="120" r="1.6" opacity="0.7"/>
    <circle cx="1210" cy="300" r="1.3" opacity="0.55"/><circle cx="1150" cy="44" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="320" r="1.4" opacity="0.55"/><circle cx="560" cy="200" r="1" opacity="0.4"/>
    <circle cx="1250" cy="200" r="1.2" opacity="0.5"/><circle cx="960" cy="230" r="1" opacity="0.4"/>
  </g>

  <!-- right-side holo panel motif -->
  <g transform="translate(1180 186)">
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="none" stroke="#4fd1ff" stroke-opacity="0.10" stroke-width="2"/>
    <polygon points="0,-108 93.5,-54 93.5,54 0,108 -93.5,54 -93.5,-54" fill="none" stroke="#4fd1ff" stroke-opacity="0.07" stroke-width="1.2"/>
  </g>
  <rect x="900" y="0" width="400" height="372" fill="url(#fadeR)" opacity="0.5"/>
  <g stroke="#4fd1ff" stroke-opacity="0.28" stroke-width="2">
    <line x1="1120" y1="120" x2="1150" y2="120"/><line x1="1120" y1="140" x2="1180" y2="140"/>
    <line x1="1120" y1="160" x2="1136" y2="160"/><line x1="1120" y1="212" x2="1166" y2="212"/>
    <line x1="1120" y1="232" x2="1142" y2="232"/><line x1="1120" y1="252" x2="1186" y2="252"/>
  </g>
  <g fill="#ffc857" fill-opacity="0.75">
    <rect x="1104" y="118" width="6" height="4"/><rect x="1104" y="138" width="6" height="4"/>
    <rect x="1104" y="158" width="6" height="4"/><rect x="1104" y="210" width="6" height="4"/>
    <rect x="1104" y="230" width="6" height="4"/><rect x="1104" y="250" width="6" height="4"/>
  </g>

  <!-- emblem -->
  <g transform="translate(200 186)">
    <polygon points="150,96 -150,96 -210,130 210,130" fill="url(#beam)"/>
    <circle r="165" fill="url(#glow)"/>
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"
             fill="none" stroke="#4fd1ff" stroke-width="4" stroke-opacity="0.95"/>
    <polygon points="0,-74 64,-37 64,37 0,74 -64,37 -64,-37"
             fill="#4fd1ff" fill-opacity="0.06" stroke="#4fd1ff" stroke-width="1.5" stroke-opacity="0.55"/>
    <g stroke="#ffc857" stroke-opacity="0.95" stroke-width="3.8" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-13"/><line x1="0" y1="13" x2="0" y2="40"/>
      <line x1="-34.6" y1="-20" x2="-11" y2="-6.5"/><line x1="11" y1="6.5" x2="34.6" y2="20"/>
      <line x1="-34.6" y1="20" x2="-11" y2="6.5"/><line x1="11" y1="-6.5" x2="34.6" y2="-20"/>
    </g>
    <circle r="7" fill="#ffc857"/>
    <rect x="-110" y="-22" width="220" height="3.5" fill="#4fd1ff" opacity="0.16"/>
    <rect x="-110" y="34" width="220" height="2" fill="#4fd1ff" opacity="0.12"/>
  </g>

  <!-- vertical divider -->
  <rect x="352" y="70" width="2" height="232" fill="#4fd1ff" opacity="0.18"/>

  <!-- title block -->
  <text x="390" y="132" fill="#4fd1ff" font-family="Consolas, 'Cascadia Mono', monospace" font-size="60" font-weight="bold" letter-spacing="14">ZERO COMPANY</text>
  <rect x="392" y="146" width="620" height="2" fill="url(#cyanline)"/>
  <text x="392" y="190" fill="#ffc857" font-family="Consolas, 'Cascadia Mono', monospace" font-size="30" font-weight="bold" letter-spacing="22">MOD COMMAND</text>

  <text x="392" y="236" fill="#8fb3c9" font-family="Consolas, 'Cascadia Mono', monospace" font-size="15" letter-spacing="3">A DEDICATED MOD MANAGER &amp; LAUNCHER FOR STAR WARS: ZERO COMPANY</text>

  <text x="392" y="282" fill="#4fd1ff" fill-opacity="0.85" font-family="Consolas, 'Cascadia Mono', monospace" font-size="12.5" letter-spacing="1.5">ONE-CLICK NEXUS INSTALLS  ·  CONFLICT DETECTION  ·  LOAD ORDER  ·  UE4SS  ·  CONFIG EDITOR</text>
  <rect x="392" y="296" width="680" height="2" fill="url(#amberline)"/>
  <text x="392" y="322" fill="#6f8ba0" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11.5" letter-spacing="5">VERSION 1.0.0  ·  PORTABLE  ·  BY ENVIAN MODS</text>

  <!-- HUD brackets -->
  <g stroke="#4fd1ff" stroke-width="3" stroke-opacity="0.6" fill="none">
    <path d="M24 72 V24 H72"/><path d="M1228 24 H1276 V72"/>
    <path d="M1276 300 V348 H1228"/><path d="M72 348 H24 V300"/>
  </g>

  <rect width="1300" height="372" fill="url(#scan)"/>
</svg>
